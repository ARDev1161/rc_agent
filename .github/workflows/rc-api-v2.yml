name: RC API v2 contracts

on:
  push:
    branches: [feat/rc-api-v2]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.proto"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - "**/*.ui"
      - "**/*.yaml"
      - "robot.cfg.in"
      - "AmurCore.cfg.in"
      - ".github/workflows/rc-api-v2.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protobuf-compatibility:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this feature branch
        uses: actions/checkout@v4
      - name: Checkout peer contract
        uses: actions/checkout@v4
        with:
          repository: ARDev1161/AmurCore
          ref: feat/rc-api-v2
          path: contract-peer
          persist-credentials: false
      - name: Check mirrored protocol files
        shell: bash
        run: |
          set -euo pipefail
          cmp network/protobuf/rc_api_v2.proto contract-peer/network/protobuf/rc_api_v2.proto
          cmp network/protobuf/robot.proto contract-peer/network/protobuf/robot.proto
          echo "Mirrored protobuf contracts match"
      - name: Install protobuf compiler + C++ library
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev python3-protobuf g++
      - name: Generate all Protobuf C++ and Python types
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          protoc --experimental_allow_proto3_optional -I network/protobuf --python_out=generated --cpp_out=generated network/protobuf/*.proto
      - name: Run Python wire-contract tests
        env:
          PYTHONPATH: generated
        run: /usr/bin/python3 -m unittest discover -s tests -p test_proto_contract.py -v
      - name: Compile and run C++ legacy/v2 roundtrip
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O0 -I generated generated/*.pb.cc tests/proto_cpp_smoke.cpp -lprotobuf -pthread -o generated/protocol_smoke
          ./generated/protocol_smoke
  config-unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ config and GTest dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libconfig++-dev libgtest-dev
      - name: Compile config parser and existing unit tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O0 -Wall -Wextra -I. config/configprocessor.cpp test/unit_tests/config_unit_tests.cpp -lconfig++ -lgtest_main -lgtest -pthread -o /tmp/rc_agent_config_tests
      - name: Test capability parsing and malformed lists
        run: /tmp/rc_agent_config_tests --gtest_filter='ConfigStringList.*' --gtest_color=yes
      - name: Exercise entire legacy config test suite
        run: /tmp/rc_agent_config_tests --gtest_color=yes
  ros2-humble-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS2/Nav2, C++ and system gRPC
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions ros-humble-nav2-msgs \
            ros-humble-rclcpp-action ros-humble-ament-cmake-gtest ros-humble-tf2-ros \
            ros-humble-sensor-msgs ros-humble-lifecycle-msgs ros-humble-action-msgs \
            libboost-system-dev libconfig++-dev nlohmann-json3-dev \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
      - name: Build rc_agent with ROS2 Humble
        shell: bash
        run: |
          set -eo pipefail
          # ROS setup references optional unset shell variables; source before nounset.
          source /opt/ros/humble/setup.bash
          set -u
          colcon build --base-paths . --packages-select rc_agent --cmake-args -DGRPC_FETCHCONTENT=OFF -DCMAKE_BUILD_TYPE=Debug --event-handlers console_direct+
      - name: Test rc_agent with colcon
        shell: bash
        run: |
          set -eo pipefail
          # ROS setup references optional unset shell variables; source before nounset.
          source /opt/ros/humble/setup.bash
          set -u
          colcon test --base-paths . --packages-select rc_agent --event-handlers console_direct+
          colcon test-result --verbose
