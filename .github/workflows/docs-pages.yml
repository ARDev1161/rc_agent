name: Documentation site

# Docs sources and CI live only on the independent documentation branch.
on:
  push:
    branches: [documentation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages-rc_agent
  cancel-in-progress: false

jobs:
  build:
    name: Sphinx + Doxygen + isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
      - name: Verify documentation branch contains no application sources
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/documentation"
          test -f docs/conf.py
          test -f docs/Doxyfile
          test ! -f CMakeLists.txt
          test ! -f package.xml
          test ! -d network
          test ! -d modules
          test ! -d logic
          test ! -d src
      - name: Checkout production source separately
        uses: actions/checkout@v4
        with:
          repository: ARDev1161/rc_agent
          ref: feat/rc-api-v2
          path: source
          persist-credentials: false
      - name: Record exact production source commit
        run: |
          set -euo pipefail
          git -C source rev-parse HEAD > docs/_source_sha.txt
          test -s docs/_source_sha.txt
          echo "Documenting $(cat docs/_source_sha.txt)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          python -m pip install -r docs/requirements.txt
      - name: Generate Doxygen XML and HTML from checked-out source
        run: doxygen docs/Doxyfile
      - name: Validate generated API output
        run: |
          set -euo pipefail
          test -s docs/_build/xml/index.xml
          test -s docs/_build/doxygen/index.html
      - name: Build Sphinx with strict reference checking
        run: sphinx-build -n -W --keep-going -b html docs docs/_build/html
      - name: Attach Doxygen HTML browser
        run: cp -a docs/_build/doxygen docs/_build/html/doxygen
      - name: Validate generated site and source revision
        run: |
          set -euo pipefail
          test -s docs/_build/html/index.html
          test -s docs/_build/html/architecture.html
          test -s docs/_build/html/protocol.html
          test -s docs/_build/html/api.html
          test -s docs/_build/html/doxygen/index.html
          grep -qi mermaid docs/_build/html/architecture.html
          grep -q "$(cut -c1-12 docs/_source_sha.txt)" docs/_build/html/index.html
          grep -q 'doxygen/index.html' docs/_build/html/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Publish site
        uses: actions/deploy-pages@v4
