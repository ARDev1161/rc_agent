syntax = "proto3";

// Additive v2 contract. Existing Robot.Controls/Sensors and navigation/map/video
// remain wire compatible during migration. This file MUST be identical in
// AmurCore and rc_agent; see PLAN.md.
package rc.api.v2;

// Identifiers are semantic, not ROS 2 topics or motor/joint names.
// Example: "manual.velocity", "navigation.nav2", "map.2d", "video".
message RobotCapability {
  string id = 1;
  // Only for manual.velocity; e.g. "linear.x", "angular.z".
  repeated string velocity_axes = 2;
}

message RobotInfo {
  string robot_id = 1;      // Stable non-empty ID from the local agent config.
  string display_name = 2;
  uint32 api_major = 3;     // 2 for this contract.
  uint32 api_minor = 4;
  repeated RobotCapability capabilities = 5;
}

// v2 values are SI units in the frame_id specified by the robot interface.
// This is NOT the legacy joystick range (-255 .. 255).
message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Velocity {
  Vector3 linear = 1;
  Vector3 angular = 2;
  string frame_id = 3;
  uint64 sequence = 4;
  uint32 valid_for_ms = 5; // Deadman TTL; mandatory when v2 teleop is enabled.
}

// Task lifecycle is independent from LLM, PlanSys2, Nav2 and OpenRMF.
message TaskStatus {
  enum State {
    STATE_UNKNOWN = 0;
    QUEUED = 1;
    ACCEPTED = 2; // Goal accepted, NOT completed.
    RUNNING = 3;
    PAUSED = 4;
    SUCCEEDED = 5;
    FAILED = 6;
    CANCELED = 7;
  }
  string task_id = 1;
  string parent_id = 2;
  string source = 3;      // e.g. "llm", "plansys2", "nav2".
  State state = 4;
  string summary = 5;
  string detail = 6;
  uint64 revision = 7;   // Monotonic per task within robot.
}

message ChatMessage {
  string message_id = 1;
  string conversation_id = 2;
  string task_id = 3;
  string sender = 4;     // "robot" or "operator"; authenticated upstream.
  oneof content {
    string text = 5;
    bytes audio = 6;     // Size-limited chunking is needed before enabling.
  }
  string audio_mime_type = 7;
}

// Future operation dispatch is through configured, allowlisted agent endpoints.
message ActionParameter {
  string name = 1;
  oneof value {
    bool bool_value = 2;
    double number_value = 3;
    string string_value = 4;
    sint64 int_value = 5;
  }
}

message CustomAction {
  string action_id = 1;
  repeated ActionParameter parameters = 2;
}

message StreamSelection {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    INACTIVE = 1; // Heartbeats and critical event notifications only.
    ACTIVE = 2;   // Position/map/task updates and selected video when opted in.
  }
  Mode mode = 1;
  string selected_camera_id = 2;
  bool enable_video = 3;
}
